<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- amazon-cognito-identity-js (via `buffer`) references Node's `global` at
         runtime, which the browser doesn't define. Vite's `define` doesn't reach the
         pre-bundled dependency, so shim it here before any module loads. -->
    <script>
      window.global ||= window;
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141210" />
    <title>Replate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
