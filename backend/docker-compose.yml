# Local AWS emulation. Replaces the Azurite + SQL Server 2025 pair.
#
# One container instead of two: LocalStack covers S3, SQS, DynamoDB, Step Functions and
# SSM behind a single endpoint on 4566, so AWS_ENDPOINT_URL is the only setting that
# differs between local dev and a real deployment.
#
# Not local at all: model calls go to the first-party Anthropic API and moderation to
# Rekognition (both real services, cheap per call, and moderation sits inside a free
# grant); Cognito stays stubbed via STUB_AUTH_HEADER_NAME. LocalStack Community does not
# emulate Rekognition or Cognito, and the Anthropic API is an external HTTPS service.
#
# Note the unit test suite does NOT need this running - it uses moto in-process. This is
# for `sam local` and the marker-gated integration tests (`pytest -m integration`).

services:
  localstack:
    # Pinned to a specific Community release, not :latest. The :latest tag drifted to a
    # 2026 build that fails to start without a LocalStack Pro auth token (exit 55). 3.8.1 is
    # the last-known token-free Community image that covers everything here. Bump this
    # deliberately after checking a new tag still starts token-free.
    image: localstack/localstack:3.8.1
    ports:
      - "4566:4566" # single edge endpoint for every service
    environment:
      SERVICES: "s3,sqs,dynamodb,stepfunctions,ssm"
      DEBUG: "${LOCALSTACK_DEBUG:-0}"
      # Enforce S3 signature checking (LocalStack skips it by default). Without this,
      # unsigned or wrong-verb GETs return 200 and the "upload URL is write-only" /
      # "bucket is not publicly readable" integration tests cannot actually verify anything.
      S3_SKIP_SIGNATURE_VALIDATION: "0"
      # Persist between restarts so a seeded table survives `docker compose down`.
      PERSISTENCE: "1"
    volumes:
      - localstack-data:/var/lib/localstack
      # LocalStack runs Lambda containers by talking to the host Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  localstack-data:
