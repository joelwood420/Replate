# End-to-end tests (Phase 5). Runs the Playwright journey against the deployed prod site
# after a deploy succeeds, plus on manual dispatch. Not a pre-merge gate: there is no staging
# environment yet, so this runs post-deploy and a failure is an alert/rollback signal rather
# than a merge blocker. Each happy-path run spends real Anthropic tokens + web_search and
# consumes the demo user's rate-limit quota, so the suite is kept lean. See docs/decisions.md.
name: E2E (post-deploy)

on:
  workflow_run:
    # Must match the `name:` of the deploy workflows exactly.
    workflows: ["Deploy frontend", "Deploy infra and backend"]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One e2e run at a time. If both deploy workflows finish close together, the second trigger
# supersedes the first instead of running a duplicate journey (and duplicate spend).
concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright journey against prod
    # workflow_run fires on any completion; only proceed on a successful deploy (or a manual run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Read stack outputs
        id: outputs
        run: |
          json=$(aws cloudformation describe-stacks \
            --stack-name "${{ vars.SAM_STACK_NAME }}" \
            --query "Stacks[0].Outputs" --output json)
          get() { echo "$json" | jq -r ".[] | select(.OutputKey==\"$1\") | .OutputValue"; }
          {
            echo "base_url=$(get CloudFrontUrl)"
            echo "table_name=$(get TableName)"
            echo "user_pool_id=$(get UserPoolId)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        working-directory: e2e
        run: npm ci

      - name: Install Playwright (chromium)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e journey
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ steps.outputs.outputs.base_url }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: npm test

      - name: Clean up e2e test data
        # Always run, even if the journey failed partway, so leftover jobs are removed.
        if: always()
        working-directory: e2e
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TABLE_NAME: ${{ steps.outputs.outputs.table_name }}
          USER_POOL_ID: ${{ steps.outputs.outputs.user_pool_id }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
        run: npm run cleanup

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
