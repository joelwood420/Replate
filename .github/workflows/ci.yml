# PR checks (Phase 4). Minimal, on-every-PR breakage catch: lint the infra template, build
# the frontend (which type-checks), and compile-check the backend. No AWS credentials are
# used here. Full unit + e2e test automation is Phase 5.
name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  infra-lint:
    name: Lint SAM template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      # --lint runs cfn-lint locally, so this needs no AWS credentials.
      - name: sam validate --lint
        working-directory: infra
        run: sam validate --lint --region ap-southeast-2

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci and build
        working-directory: frontend
        # Placeholder build-time config. This job only proves the app compiles (npm run build
        # runs tsc -b first); it does not publish. deploy-frontend.yml injects the real values.
        env:
          VITE_API_BASE_URL: https://example.invalid
          VITE_COGNITO_ENABLED: "false"
        run: |
          npm ci
          npm run build

  backend-compile:
    name: Compile-check backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps and compileall
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          python -m compileall backend
