# ---------------------------------------------------------------------------------------
Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL — set as the frontend's VITE_API_BASE_URL.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CloudFrontUrl:
    Description: Public URL of the React site.
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
  CloudFrontDistributionId:
    Description: Distribution id — for cache invalidations after a frontend deploy.
    Value: !Ref CloudFrontDistribution
  SiteBucketName:
    Description: Bucket the React build is synced to.
    Value: !Ref SiteBucket
  UploadsBucketName:
    Description: Bucket photos are uploaded to (must be emptied before teardown).
    Value: !Ref UploadsBucket
  TableName:
    Value: !Ref Table
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Description: SPA app client id — the frontend's VITE_COGNITO_CLIENT_ID.
    Value: !Ref UserPoolClient
  CognitoIssuer:
    Description: OIDC issuer / authority — the frontend's VITE_COGNITO_AUTHORITY.
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
  CognitoHostedUiDomain:
    Description: Hosted-UI domain for sign-in redirects.
    Value: !Sub "https://replate-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
  IdentifyStateMachineArn:
    Value: !Ref IdentifyStateMachine
  RecipeStateMachineArn:
    Value: !Ref RecipeStateMachine
  JobQueueUrl:
    Value: !Ref JobQueue
