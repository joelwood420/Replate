# SAM CLI configuration. Prod-only for now (CLAUDE.md Global Rule 2) — a single
# [default] environment. Region is Sydney per docs/decisions.md (2026-08-14).
version = 0.1

[default.global.parameters]
stack_name = "replate"

[default.build.parameters]
# numpy in the dependencies layer is a compiled wheel; building it for the Lambda
# platform from Windows/macOS needs Docker. Requires Docker running.
use_container = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
region = "ap-southeast-2"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
# Moderation stays off. The recipe generator is now wired to a real model
# (claude-sonnet-5) - it fires against the ANTHROPIC_API_KEY held in SSM. Vision
# and menu models stay at their template defaults (still stubbed / key-gated).
parameter_overrides = "ModerationEnabled=false AnthropicGeneratorModel=claude-sonnet-5"
